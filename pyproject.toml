[project]
name = "event-flow-ai"
version = "0.1.0"
description = "Event-driven AI workflow framework: DAG workflows of nodes, FastAPI, Celery, Postgres."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "celery[redis]>=5.5",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "langfuse>=3.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,google,groq,openai]>=1.94",
    "pydantic-settings>=2.10",
    "python-frontmatter>=1.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/eventflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
